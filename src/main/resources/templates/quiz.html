<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Trivia - Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-200 text-cyan-950">
<header class="sticky top-0 z-10 bg-cyan-950 text-amber-600">
    <section class="max-w-4xl mx-auto flex items-center justify-between p-4">
        <a href="/" class="text-3xl font-medium tracking-wide">
            <span class="text-neutral-200">QUAD</span> TRIVIA
        </a>
    </section>
</header>
<main class="max-w-4xl mx-auto p-4">
    <form th:action="@{/checkanswers}" method="post" class="mt-8 space-y-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="quizId" th:value="${quiz.quizId()}">
        <section class="rounded-2xl border border-amber-600 bg-cyan-900 p-5 text-neutral-100 shadow">
            <h1 class="text-3xl font-bold">Trivia ronde</h1>
        </section>

        <section th:each="question, questionStat : ${quiz.questions()}"
                 class="rounded-2xl border border-amber-600 bg-neutral-100 p-5 shadow">
            <input type="hidden"
                   th:name="|answers[${questionStat.index}].questionId|"
                   th:value="${question.id()}">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
                <p class="text-sm font-bold uppercase tracking-wide text-amber-600"
                   th:utext="${question.category()}">Category</p>
                <p class="text-sm font-semibold text-cyan-800" th:text="${question.difficulty()}">medium</p>
            </div>
            <h2 class="mt-3 text-2xl font-bold" th:utext="${question.question()}">Question</h2>
            <div class="mt-5 grid gap-3">
                <label th:each="option : ${question.options()}"
                       class="flex cursor-pointer items-center gap-3 rounded-xl border-2 border-cyan-950 bg-white p-3 font-semibold shadow-[4px_4px_0_#083344] transition hover:bg-amber-50">
                    <input type="radio"
                           th:name="|answers[${questionStat.index}].answer|"
                           th:value="${option}"
                           class="h-5 w-5 accent-amber-600"
                           required>
                    <span th:utext="${option}">Answer</span>
                </label>
            </div>
        </section>

        <button type="submit"
                class="mb-8 rounded-xl border-2 border-cyan-950 bg-amber-600 px-5 py-3 font-bold text-neutral-100 shadow-[4px_4px_0_#083344] transition hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_#083344]">
            Verstuur antwoorden
        </button>
    </form>
</main>
</body>
</html>
