<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quad Trivia · Quiz')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="site-main site-main--quiz">
    <form th:action="@{/checkanswers}" method="post" class="quiz-shell"
          data-answer-form data-quiz-form>
        <input type="hidden" name="quizId" th:value="${quiz.quizId()}">

        <header class="quiz-header">
            <div>
                <p class="eyebrow eyebrow--light">Tijd om te schitteren</p>
                <h1>Jouw quiz</h1>
            </div>
            <div class="quiz-progress__copy">
                <strong data-progress-label th:text="|Vraag 1 van ${quiz.questions().size()}|">Vraag 1 van 5</strong>
                <span>Elke keuze telt</span>
            </div>
            <div class="quiz-progress" role="progressbar" aria-label="Voortgang quiz"
                 aria-valuemin="1" th:aria-valuemax="${quiz.questions().size()}" aria-valuenow="1"
                 th:aria-valuetext="|Vraag 1 van ${quiz.questions().size()}|" data-progress>
                <span data-progress-fill
                      th:style="|width: ${(100 / quiz.questions().size())}%|"></span>
            </div>
        </header>

        <fieldset th:each="question, questionStat : ${quiz.questions()}"
                  class="question-card" data-quiz-question th:data-question-index="${questionStat.index}">
            <legend class="sr-only">
                <span th:text="|Vraag ${questionStat.count}: |">Vraag 1: </span>
                <span th:utext="${question.question()}">Vraag</span>
            </legend>
            <input type="hidden"
                   th:name="|answers[${questionStat.index}].questionId|"
                   th:value="${question.id()}">

            <div class="question-card__meta">
                <p class="question-card__category" th:utext="${question.category()}">Categorie</p>
                <span class="difficulty-badge"
                      th:text="${question.difficulty() == 'easy' ? 'Makkelijk' : (question.difficulty() == 'medium' ? 'Gemiddeld' : 'Moeilijk')}">Gemiddeld</span>
            </div>

            <h2 class="question-card__title" tabindex="-1" data-question-title th:utext="${question.question()}">Vraag</h2>

            <div class="answer-grid">
                <label th:each="option : ${question.options()}" class="answer-option">
                    <input type="radio"
                           th:name="|answers[${questionStat.index}].answer|"
                           th:value="${option}"
                           required>
                    <span class="answer-option__marker" aria-hidden="true"></span>
                    <span th:utext="${option}">Antwoord</span>
                </label>
            </div>
        </fieldset>

        <footer class="quiz-actions">
            <p class="quiz-validation" data-quiz-validation role="status" aria-live="polite"></p>
            <div class="quiz-step-controls">
                <button type="button" class="button button--secondary" data-previous-button>← Vorige vraag</button>
                <button type="button" class="button button--primary" data-next-button>Volgende vraag →</button>
            </div>
            <button type="submit" class="button button--primary quiz-submit" data-submit-button>
                <span data-loading-indicator class="spinner" hidden aria-hidden="true"></span>
                <span data-idle-label>Verstuur antwoorden</span>
                <span data-loading-label hidden>Score berekenen…</span>
                <span class="button__arrow" aria-hidden="true">→</span>
            </button>
            <p class="form-status" data-form-status aria-live="polite"></p>
        </footer>
    </form>
</main>
</body>
</html>
