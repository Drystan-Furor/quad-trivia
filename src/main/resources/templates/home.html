<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quad Trivia')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="site-main site-main--home">
    <section class="home-grid" aria-labelledby="page-title">
        <div class="hero-copy">
            <p class="eyebrow">Welkom bij de slimste spelavond</p>
            <h1 id="page-title">Hoeveel weet jij <em>echt?</em></h1>
            <p class="hero-copy__intro">
                Stel je eigen ronde samen, kies je antwoorden en ontdek direct je score.
                Geen accounts, geen afleiding — alleen sterke vragen.
            </p>
            <ul class="feature-list" aria-label="Voordelen">
                <li><span aria-hidden="true">✓</span> 24 categorieën</li>
                <li><span aria-hidden="true">✓</span> 1–50 vragen</li>
                <li><span aria-hidden="true">✓</span> Antwoorden blijven geheim</li>
            </ul>
        </div>

        <section class="setup-card" aria-labelledby="setup-title">
            <div class="setup-card__heading">
                <p class="eyebrow">Jouw spel, jouw regels</p>
                <h2 id="setup-title">Stel je quiz samen</h2>
            </div>

            <form th:action="@{/questions}" method="post" class="setup-form" data-question-form>
                <label for="amount" class="form-field">
                    <span>Aantal vragen</span>
                    <input id="amount" name="amount" type="number" min="1" max="50" value="5" inputmode="numeric" required>
                    <small>Tussen 1 en 50</small>
                </label>

                <label for="category" class="form-field">
                    <span>Categorie</span>
                    <select id="category" name="category">
                        <option value="">Alle categorieën</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id()}"
                                th:text="${category.displayName()}">Science: Computers</option>
                    </select>
                </label>

                <label for="difficulty" class="form-field">
                    <span>Moeilijkheid</span>
                    <select id="difficulty" name="difficulty">
                        <option th:each="difficulty : ${difficulties}"
                                th:value="${difficulty.apiValue()}"
                                th:text="${difficulty.displayName()}">Alle niveaus</option>
                    </select>
                </label>

                <label for="type" class="form-field">
                    <span>Vraagtype</span>
                    <select id="type" name="type">
                        <option th:each="type : ${types}"
                                th:value="${type.apiValue()}"
                                th:text="${type.displayName()}">Alle vraagtypen</option>
                    </select>
                </label>

                <button type="submit" class="button button--primary setup-form__submit" data-submit-button>
                    <span data-loading-indicator class="spinner" hidden aria-hidden="true"></span>
                    <span data-idle-label>Start quiz</span>
                    <span data-loading-label hidden>Vragen ophalen…</span>
                    <span class="button__arrow" aria-hidden="true">→</span>
                </button>
                <p class="form-status" data-form-status aria-live="polite"></p>
            </form>
        </section>
    </section>
</main>
</body>
</html>
