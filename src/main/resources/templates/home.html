<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Trivia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/js/global.js"></script>
</head>
<body class="min-h-screen bg-neutral-200 text-cyan-950">
<header class="sticky top-0 z-10 bg-cyan-950 text-amber-600">
    <section class="max-w-4xl mx-auto flex items-center justify-between p-4">
        <a href="/" class="text-3xl font-medium tracking-wide">
            <span class="text-neutral-200">QUAD</span> TRIVIA
        </a>
    </section>
</header>
<main class="max-w-4xl mx-auto p-4">
    <section class="mt-10 rounded-2xl border border-amber-600 bg-neutral-100 p-6 shadow">
        <p class="text-sm font-bold uppercase tracking-wide text-amber-600">Trivia ronde</p>
        <h1 class="mt-2 text-4xl font-bold">Quad Trivia</h1>
        <form th:action="@{/questions}" method="post" class="mt-8 flex flex-col gap-4 sm:flex-row sm:items-end" data-question-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="amount" class="flex flex-col gap-2 text-sm font-semibold">
                Aantal vragen
                <input id="amount" name="amount" type="number" min="1" max="10" value="5"
                       class="w-36 rounded-xl border-2 border-cyan-950 bg-white px-3 py-2 text-base shadow-[4px_4px_0_#083344]">
            </label>
            <label for="category" class="flex flex-col gap-2 text-sm font-semibold">
                Categorie
                <select id="category" name="category"
                        class="w-72 rounded-xl border-2 border-cyan-950 bg-white px-3 py-2 text-base shadow-[4px_4px_0_#083344]">
                    <option value="">Any Category</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.id()}"
                            th:text="${category.displayName()}">Science: Computers</option>
                </select>
            </label>
            <button type="submit"
                    class="inline-flex items-center gap-3 rounded-xl border-2 border-cyan-950 bg-amber-600 px-5 py-3 font-bold text-neutral-100 shadow-[4px_4px_0_#083344] transition hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_#083344] disabled:cursor-not-allowed disabled:opacity-80 disabled:hover:translate-x-0 disabled:hover:translate-y-0 disabled:hover:shadow-[4px_4px_0_#083344]"
                    data-submit-button>
                <span data-loading-indicator class="hidden h-5 w-5 animate-spin rounded-full border-2 border-neutral-100 border-t-transparent"
                      aria-hidden="true"></span>
                <span data-idle-label>Start ronde</span>
                <span data-loading-label class="hidden">Ronde laden...</span>
            </button>
        </form>
    </section>
</main>
</body>
</html>
