<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Trivia - Resultaat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-200 text-cyan-950">
<header class="sticky top-0 z-10 bg-cyan-950 text-amber-600">
    <section class="max-w-4xl mx-auto flex items-center justify-between p-4">
        <a href="/" class="text-3xl font-medium tracking-wide">
            <span class="text-neutral-200">QUAD</span> TRIVIA
        </a>
    </section>
</header>
<main class="max-w-4xl mx-auto p-4">
    <section class="mt-8 rounded-2xl border border-amber-600 bg-neutral-100 p-6 shadow">
        <p class="text-sm font-bold uppercase tracking-wide text-amber-600">Resultaat</p>
        <h1 class="mt-2 text-4xl font-bold"
            th:text="|Score ${results.score()} / ${results.totalQuestions()}|">Score 0 / 0</h1>
        <ol class="mt-6 space-y-3">
            <li th:each="result, resultStat : ${results.results()}"
                class="rounded-xl border-2 border-cyan-950 bg-white p-3 font-semibold shadow-[4px_4px_0_#083344]">
                <span th:text="|Vraag ${resultStat.count}|">Vraag 1</span>
                <span class="ml-2 text-emerald-700" th:if="${result.correct()}">goed</span>
                <span class="ml-2 text-red-700" th:unless="${result.correct()}">fout</span>
            </li>
        </ol>
        <a th:href="@{/}"
           class="mt-6 inline-block rounded-xl border-2 border-cyan-950 bg-amber-600 px-5 py-3 font-bold text-neutral-100 shadow-[4px_4px_0_#083344] transition hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_#083344]">
            Nieuwe ronde
        </a>
    </section>
</main>
</body>
</html>
