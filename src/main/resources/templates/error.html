<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quad Trivia · Oeps')}"></head>
<body>
<header th:replace="~{fragments/layout :: siteHeader}"></header>

<main class="site-main site-main--centered">
    <section class="error-card" aria-labelledby="error-title">
        <div class="error-card__mark" aria-hidden="true">!</div>
        <p class="eyebrow">Dat ging niet zoals gepland</p>
        <h1 id="error-title">Oeps, de ronde hapert</h1>
        <p class="error-card__message" th:text="${errorMessage}">Er is iets misgegaan.</p>
        <a th:href="@{/}" href="/" class="button button--primary">Terug naar start →</a>
    </section>
</main>
</body>
</html>
